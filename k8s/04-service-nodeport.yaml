apiVersion: v1
kind: Service
metadata:
  name: hello-nodeport
  labels:
    app: hello
spec:
  type: NodePort         # accessible depuis l'extérieur via <NodeIP>:<NodePort>
  selector:
    app: hello
  ports:
    - name: http
      port: 80           # port interne au cluster
      targetPort: 5000   # port du conteneur
      nodePort: 30080    # port exposé sur chaque Node (plage 30000-32767)
      protocol: TCP
