apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-config
  labels:
    app: hello
data:
  # Variables consommées par l'application
  APP_ENV: "production"
  APP_PORT: "5000"
  # Fichier de config monté en volume (cf. pod 08)
  app.properties: |
    log.level=INFO
    feature.flag.beta=true
    cache.ttl.seconds=300
